<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Стандарт Строй" />
    <title>Стандарт Строй</title>
    <script>
      (() => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
        }
        if ("caches" in window) {
          caches
            .keys()
            .then((keys) => keys.forEach((key) => caches.delete(key)))
            .catch(() => {});
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260511-0010" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <div class="balance-label">Баланс</div>
          <div id="totalBalance" class="total-balance">0 ₽</div>
          <h1 id="screenTitle">Главная</h1>
        </div>
        <button id="settingsTopBtn" class="header-menu" data-view="settingsView" data-title="Настройки" aria-label="Настройки">
          <span class="dots-icon" aria-hidden="true"></span>
        </button>
      </header>

      <main>
        <section id="accountsView" class="view active">
          <div id="accountsList" class="plain-list"></div>
          <section class="main-section">
            <div class="section-head compact-head">
              <h2>Инвесторы</h2>
            </div>
            <div id="investmentsList" class="investments-list"></div>
          </section>
        </section>

        <section id="operationsView" class="view">
          <div class="section-head">
            <h2>Журнал операций</h2>
            <button id="operationsEditBtn" class="small-action edit-toggle" type="button">Изменить</button>
          </div>
          <div id="operationFilterBar" class="filter-bar" hidden></div>
          <div id="operationsList" class="operations-list"></div>
          <button id="addFromJournalBtn" class="floating-add" aria-label="Добавить операцию"><span aria-hidden="true">+</span></button>
        </section>

        <section id="addView" class="view">
          <form id="operationForm" class="form-stack">
            <section>
              <div class="field-title">Тип операции</div>
              <div id="typeCards" class="cards-grid compact"></div>
            </section>

            <label class="field-label">
              Сумма
              <input id="amountInput" name="amount" inputmode="decimal" autocomplete="off" placeholder="0" />
            </label>
            <div class="calc-bar" aria-label="Калькулятор суммы">
              <button type="button" data-calc="+">+</button>
              <button type="button" data-calc="-">−</button>
              <button type="button" data-calc="*">×</button>
              <button type="button" data-calc="/">÷</button>
              <button type="button" data-calc="=">=</button>
              <button type="button" data-calc="clear">C</button>
            </div>

            <div id="standardFields" class="form-stack">
              <section>
                <div class="field-title">Счет</div>
                <div id="accountCards" class="cards-grid"></div>
              </section>

              <section>
                <div class="field-title">Объект</div>
                <div id="projectCards" class="cards-grid"></div>
              </section>

              <label class="check-line">
                <input id="vatInput" name="vat" type="checkbox" />
                <span>С НДС</span>
              </label>

              <label class="field-label">
                Категория
                <select id="categorySelect" name="category"></select>
              </label>

              <label class="field-label">
                Контрагент
                <select id="counterpartySelect" name="counterparty"></select>
              </label>

              <label class="field-label">
                Комментарий
                <textarea id="commentInput" name="comment" placeholder="Коротко о платеже"></textarea>
              </label>

              <div class="photo-line">
                <label class="camera-button" title="Добавить фото">
                  <input id="photoInput" name="photos" type="file" accept="image/*,.pdf" multiple />
                  <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8.5 7.5 10 5.5h4l1.5 2h2A2.5 2.5 0 0 1 20 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5V10a2.5 2.5 0 0 1 2.5-2.5h2Z" />
                    <circle cx="12" cy="13" r="3.25" />
                  </svg>
                </label>
                <div id="photoInfo" class="photo-info">Фото не выбрано</div>
              </div>
            </div>

            <div id="transferFields" class="form-stack" hidden>
              <section>
                <div class="field-title">Откуда</div>
                <div id="transferFromCards" class="cards-grid"></div>
              </section>

              <button id="swapTransferBtn" class="swap-button" type="button" aria-label="Поменять счета местами">⇅</button>

              <section>
                <div class="field-title">Куда</div>
                <div id="transferToCards" class="cards-grid"></div>
              </section>

              <label class="field-label">
                Дата
                <input id="transferDateInput" name="transferDate" type="datetime-local" />
              </label>

              <label class="check-line">
                <input id="transferVatInput" name="transferVat" type="checkbox" />
                <span>С НДС</span>
              </label>

              <label class="field-label">
                Комментарий
                <textarea id="transferCommentInput" name="transferComment" placeholder="Например: пополнение Леруа"></textarea>
              </label>
            </div>

            <div id="debtFields" class="form-stack" hidden>
              <section>
                <div class="field-title">Действие по долгу</div>
                <div id="debtActionCards" class="cards-grid debt-grid"></div>
              </section>

              <section>
                <div class="field-title">Счет</div>
                <div id="debtAccountCards" class="cards-grid"></div>
              </section>

              <label class="field-label">
                Контрагент
                <select id="debtCounterpartySelect" name="debtCounterparty"></select>
              </label>

              <label class="field-label">
                Дата
                <input id="debtDateInput" name="debtDate" type="datetime-local" />
              </label>

              <label class="field-label">
                Комментарий
                <textarea id="debtCommentInput" name="debtComment" placeholder="Кому, за что, когда вернуть"></textarea>
              </label>
            </div>

            <button id="operationSubmitBtn" type="button" class="save-button">Добавить операцию</button>
          </form>
        </section>

        <section id="overviewView" class="view">
          <section>
            <div class="field-title">Объект</div>
            <div id="overviewProjectCards" class="cards-grid"></div>
          </section>

          <div id="overviewProjectSummary" class="project-summary"></div>

          <section class="main-section">
            <div class="section-head compact-head">
              <h2>Расходы</h2>
            </div>
            <div id="overviewCategoryList" class="summary-list"></div>
          </section>

          <section class="main-section">
            <div class="section-head compact-head">
              <h2>Рабочие</h2>
            </div>
            <div id="overviewWorkerList" class="worker-list"></div>
          </section>
        </section>

        <section id="settingsView" class="view">
          <div class="settings-toolbar">
            <button id="settingsEditBtn" class="small-action edit-toggle" type="button">Изменить</button>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Аккаунт</h2>
            </div>
            <div id="authPanel" class="auth-panel"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Данные</h2>
            </div>
            <div class="settings-tools">
              <button id="exportDataBtn" class="small-action" type="button">Экспорт</button>
              <button id="importJsonBtn" class="small-action" type="button">Импорт</button>
              <input id="importJsonInput" class="import-input" type="file" accept="application/json,.json" />
            </div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Счета</h2>
              <button class="small-action add-action" data-add="account" aria-label="Добавить счет">+</button>
            </div>
            <div id="settingsAccounts" class="settings-list"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Инвесторы</h2>
              <button class="small-action add-action" data-add="investor" aria-label="Добавить инвестора">+</button>
            </div>
            <div id="settingsInvestors" class="settings-list"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Объекты</h2>
              <button class="small-action add-action" data-add="project" aria-label="Добавить объект">+</button>
            </div>
            <div id="settingsProjects" class="settings-list"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Категории</h2>
              <button class="small-action add-action" data-add="category" aria-label="Добавить категорию">+</button>
            </div>
            <div id="settingsCategories" class="settings-list"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Рабочие/контрагенты</h2>
              <button class="small-action add-action" data-add="counterparty" aria-label="Добавить контрагента">+</button>
            </div>
            <div id="settingsCounterparties" class="settings-list"></div>
          </div>

          <div class="settings-group">
            <div class="section-head">
              <h2>Архив операций</h2>
            </div>
            <div id="settingsArchivedOperations" class="settings-list"></div>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Разделы">
        <button class="nav-button active" data-view="accountsView" data-title="Главная">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="6" width="16" height="12" rx="3" />
            <path d="M4 10h16" />
          </svg>
          Главная
        </button>
        <button class="nav-button" data-view="operationsView" data-title="Операции">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14" />
            <path d="M5 12h14" />
            <path d="M5 17h14" />
          </svg>
          Операции
        </button>
        <button class="nav-button" data-view="overviewView" data-title="Обзор">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V5" />
            <path d="M4 19h16" />
            <rect x="7" y="11" width="2.8" height="5" rx="1" />
            <rect x="12" y="8" width="2.8" height="8" rx="1" />
            <rect x="17" y="5" width="2.8" height="11" rx="1" />
          </svg>
          Обзор
        </button>
      </nav>
    </div>

    <dialog id="settingsDialog">
      <form id="settingsForm" class="dialog-card">
        <h2 id="dialogTitle">Добавить</h2>
        <div id="dialogFields" class="form-stack"></div>
        <div class="dialog-actions">
          <button id="dialogCancelBtn" type="button" class="ghost-button">Отмена</button>
          <button id="dialogSaveBtn" type="button" class="save-button">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog id="attachmentDialog">
      <div class="attachment-card">
        <div class="attachment-head">
          <strong id="attachmentTitle">Вложение</strong>
          <button id="attachmentCloseBtn" type="button" class="icon-mini" aria-label="Закрыть">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 7 10 10" />
              <path d="m17 7-10 10" />
            </svg>
          </button>
        </div>
        <div id="attachmentPreview" class="attachment-preview"></div>
        <div id="attachmentOperationInfo" class="attachment-operation-info"></div>
        <div class="attachment-actions">
          <a id="attachmentOpenLink" class="ghost-button attachment-link" target="_blank" rel="noopener">Открыть</a>
          <a id="attachmentDownloadLink" class="save-button attachment-link" download>Скачать</a>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./firebase-config.js?v=20260511-0010" defer></script>
    <script src="./app.js?v=20260511-0010" defer></script>
  </body>
</html>
