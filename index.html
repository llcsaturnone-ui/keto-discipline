<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Кето" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Keto Discipline</title>
  <style>
    :root {
      --bg: #05070a;
      --bg2: #0b1017;
      --card: rgba(17, 24, 39, .92);
      --card2: rgba(31, 41, 55, .72);
      --line: rgba(148, 163, 184, .18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --muted2: #64748b;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #38bdf8;
      --violet: #a78bfa;
      --shadow: 0 22px 80px rgba(0,0,0,.45);
      --radius: 22px;
      --bottom-nav: 68px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; }
    body { position: fixed; inset: 0; overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: max(env(safe-area-inset-top), 14px) 14px calc(var(--bottom-nav) + 10px);
      background:
        radial-gradient(circle at 15% -10%, rgba(34,197,94,.18), transparent 35%),
        radial-gradient(circle at 100% 5%, rgba(56,189,248,.15), transparent 32%),
        linear-gradient(180deg, #05070a 0%, #081018 45%, #05070a 100%);
    }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin: 4px 0 14px; }
    .brand { display:flex; align-items:center; gap:10px; min-width: 0; }
    .logo { width: 42px; height:42px; border-radius: 15px; display:grid; place-items:center; background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.8)); box-shadow: 0 12px 30px rgba(34,197,94,.18); font-weight: 900; color:#06120a; }
    .brand h1 { font-size: 19px; margin:0; line-height: 1.05; letter-spacing: -.02em; }
    .brand p { margin:3px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; max-width: 220px; }
    .dateNav { display:flex; align-items:center; gap: 6px; background: rgba(15,23,42,.75); border:1px solid var(--line); border-radius: 16px; padding: 5px; }
    .dateNav button { width: 30px; height:30px; border-radius: 12px; background: rgba(148,163,184,.12); color: var(--text); }
    .dateNav input { width: 126px; color: var(--text); background: transparent; border: 0; outline: 0; font-size: 12px; }
    .screen { display:none; animation: fade .18s ease; }
    .screen.active { display:block; }
    @keyframes fade { from { opacity:.45; transform: translateY(4px);} to {opacity:1; transform: none;} }
    .grid { display:grid; gap: 12px; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .card.soft { background: rgba(15,23,42,.70); box-shadow: none; }
    .cardTitle { display:flex; align-items:center; justify-content:space-between; gap: 8px; margin-bottom: 12px; }
    .cardTitle h2, .cardTitle h3 { margin:0; font-size: 16px; letter-spacing: -.01em; }
    .cardTitle span { color: var(--muted); font-size: 12px; }
    .hero { padding: 16px; overflow: hidden; position:relative; }
    .hero:after { content:""; position:absolute; right:-50px; top:-70px; width:170px; height:170px; border-radius:999px; background: rgba(34,197,94,.15); filter: blur(8px); }
    .heroStatus { display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; position:relative; z-index:1; }
    .statusBadge { display:inline-flex; align-items:center; gap:8px; padding: 9px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; border:1px solid var(--line); white-space: nowrap; }
    .good { color: #86efac; background: rgba(34,197,94,.13); border-color: rgba(34,197,94,.30); }
    .warn { color: #fcd34d; background: rgba(245,158,11,.13); border-color: rgba(245,158,11,.30); }
    .bad { color: #fca5a5; background: rgba(239,68,68,.13); border-color: rgba(239,68,68,.30); }
    .neutral { color: #bae6fd; background: rgba(56,189,248,.12); border-color: rgba(56,189,248,.25); }
    .scoreBig { font-size: 44px; font-weight: 950; letter-spacing: -.06em; line-height: .9; margin: 14px 0 4px; }
    .subtle { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .advice { margin-top: 12px; padding: 12px; border-radius: 18px; background: rgba(2,6,23,.38); border:1px solid var(--line); color:#e2e8f0; font-size: 13px; line-height: 1.35; position:relative; z-index:1; }
    .metric { padding: 13px; border-radius: 20px; background: rgba(15,23,42,.75); border: 1px solid var(--line); }
    .metric .label { display:flex; justify-content:space-between; gap:8px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric .num { font-size: 21px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 9px; }
    .progress { height: 8px; background: rgba(148,163,184,.17); border-radius: 999px; overflow:hidden; }
    .bar { height: 100%; width:0%; background: linear-gradient(90deg, var(--green), var(--blue)); border-radius:999px; transition: width .2s ease; }
    .bar.warnbar { background: linear-gradient(90deg, var(--yellow), #f97316); }
    .bar.badbar { background: linear-gradient(90deg, var(--red), #fb7185); }
    .btn { display:inline-flex; justify-content:center; align-items:center; gap:8px; min-height: 44px; padding: 11px 14px; border-radius: 16px; color: var(--text); background: rgba(148,163,184,.14); border:1px solid var(--line); font-weight: 800; }
    .btn.primary { color:#04120a; background: linear-gradient(135deg, #22c55e, #67e8f9); border:0; }
    .btn.danger { background: rgba(239,68,68,.14); color:#fecaca; border-color: rgba(239,68,68,.25); }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.small { min-height: 34px; padding: 7px 10px; border-radius: 12px; font-size: 12px; }
    .btn.full { width: 100%; }
    .form { display:grid; gap: 10px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display:block; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
    input, select, textarea { width:100%; color: var(--text); background: rgba(2,6,23,.45); border:1px solid var(--line); border-radius: 16px; outline:none; padding: 12px 12px; min-height: 44px; }
    textarea { min-height: 76px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: rgba(56,189,248,.55); box-shadow: 0 0 0 3px rgba(56,189,248,.08); }
    .list { display:grid; gap: 10px; }
    .item { border:1px solid var(--line); background: rgba(2,6,23,.28); border-radius: 18px; padding: 12px; display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
    .item h4 { margin:0 0 5px; font-size: 14px; }
    .item p { margin:0; color: var(--muted); font-size: 12px; line-height:1.35; }
    .item .actions { display:flex; gap:6px; flex-shrink:0; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding: 5px 8px; border-radius:999px; font-size: 11px; font-weight: 800; border:1px solid var(--line); color: var(--muted); background: rgba(148,163,184,.08); }
    .pill.good { color:#86efac; }
    .pill.warn { color:#fcd34d; }
    .pill.bad { color:#fca5a5; }
    .totals { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .totalBox { padding: 10px 7px; border-radius: 16px; background: rgba(15,23,42,.72); border:1px solid var(--line); text-align:center; }
    .totalBox b { display:block; font-size: 16px; }
    .totalBox span { color: var(--muted); font-size: 11px; }
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 6px 8px 6px; background: rgba(5,7,10,.84); border-top: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display:grid; grid-template-columns: repeat(6, 1fr); gap: 5px; transform: translateZ(0); }
    .tab { min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 3px; height: 52px; border-radius: 17px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 800; }
    .tab .ico { font-size: 19px; line-height:1; }
    .tab.active { color:#dcfce7; background: rgba(34,197,94,.16); }
    .empty { color: var(--muted); text-align:center; padding: 22px 8px; border:1px dashed var(--line); border-radius: 18px; font-size:13px; }
    .toast { position:fixed; left:14px; right:14px; bottom: calc(var(--bottom-nav) + 10px); z-index: 50; padding: 13px 14px; border-radius: 18px; background: rgba(15,23,42,.95); border:1px solid var(--line); box-shadow: var(--shadow); color:#e2e8f0; opacity:0; pointer-events:none; transform: translateY(8px); transition: .18s ease; }
    .toast.show { opacity:1; transform: none; }
    .modalBackdrop { position:fixed; inset:0; z-index: 60; background: rgba(0,0,0,.62); display:none; align-items:flex-end; padding: 12px; }
    .modalBackdrop.show { display:flex; }
    .modal { width:100%; max-height: 88svh; overflow:auto; background: #0b1017; border:1px solid var(--line); border-radius: 26px; padding: 14px; box-shadow: var(--shadow); }
    .modalHead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 12px; }
    .modalHead h3 { margin:0; }
    .switchLine { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 12px; border:1px solid var(--line); border-radius: 17px; background: rgba(2,6,23,.25); }
    .switchLine div b { display:block; font-size: 14px; }
    .switchLine div span { color: var(--muted); font-size: 12px; }
    .check { width: 30px; height:30px; border-radius: 11px; background: rgba(148,163,184,.16); border:1px solid var(--line); color: transparent; display:grid; place-items:center; font-weight:900; }
    .check.on { background: rgba(34,197,94,.20); border-color: rgba(34,197,94,.35); color:#86efac; }
    .chartWrap { width:100%; height: 210px; border:1px solid var(--line); border-radius: 18px; background: rgba(2,6,23,.28); overflow:hidden; }
    .chartWrap svg { width:100%; height:100%; display:block; }
    .mutedLink { color:#bae6fd; text-decoration:none; }
    .dangerText { color:#fca5a5; }
    .mono { font-variant-numeric: tabular-nums; }
    .summaryLine { display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 9px 0; border-bottom:1px solid rgba(148,163,184,.11); }
    .summaryLine:last-child { border-bottom:0; }
    .summaryLine span { color: var(--muted); font-size: 13px; }
    .summaryLine b { font-size: 13px; }
    @media (min-width: 820px) {
      .app { max-width: 820px; margin:0 auto; }
      .modalBackdrop { justify-content:center; align-items:center; }
      .modal { max-width: 660px; }
      .tabs { left:50%; transform:translateX(-50%); width:820px; border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius: 24px 24px 0 0; }
    }
    @media (max-width: 390px) {
      .grid2 { gap: 9px; }
      .metric .num { font-size: 18px; }
      .totals { grid-template-columns: repeat(2, 1fr); }
      .brand p { max-width: 160px; }
      .dateNav input { width: 118px; }
      .tabs { gap: 2px; padding-left: 6px; padding-right: 6px; }
      .tab { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>

<script>
(() => {
  const STORAGE_KEY = 'keto-discipline-v1';
  const todayISO = () => {
    const d = new Date();
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
  const round = (n, d = 1) => Number.isFinite(+n) ? Math.round((+n) * Math.pow(10, d)) / Math.pow(10, d) : 0;
  const fmt = (n, d = 0) => round(n, d).toLocaleString('ru-RU', { maximumFractionDigits: d, minimumFractionDigits: d });
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const esc = (s) => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const parseNum = (v) => {
    if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
    const n = parseFloat(String(v ?? '').replace(',', '.'));
    return Number.isFinite(n) ? n : 0;
  };
  const ruDate = (iso) => {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
  };
  const isoParts = (iso) => String(iso || todayISO()).split('-').map(Number);
  const isoFromDate = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  };
  const dayDiff = (a,b) => {
    const [ay,am,ad] = isoParts(a);
    const [by,bm,bd] = isoParts(b);
    return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
  };
  const addDays = (iso, n) => {
    const [y,m,d] = isoParts(iso);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() + n);
    return isoFromDate(date);
  };

  const defaultState = {
    version: 1,
    activeTab: 'today',
    selectedDate: todayISO(),
    settings: {
      startDate: '2026-05-01',
      calorieGoal: 2000,
      calorieMax: 2200,
      proteinGoal: 150,
      fatGoal: 130,
      carbGoal: 25,
      carbWarn: 40,
      carbFail: 50,
      waterGoal: 2.5,
      stepsGoal: 7000,
      fastingWindow: '16/8',
      lastMealTime: '20:00'
    },
    products: [],
    entries: [],
    draft: [],
    daily: {},
    checklist: {}
  };

  let state = loadState();
  let editingProductId = null;
  let editingEntryId = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return mergeDefaults(defaultState, parsed);
    } catch (e) {
      console.warn(e);
      return structuredClone(defaultState);
    }
  }
  function mergeDefaults(base, data) {
    const out = structuredClone(base);
    Object.assign(out, data || {});
    out.settings = Object.assign({}, base.settings, data?.settings || {});
    out.products = Array.isArray(data?.products) ? data.products : [];
    out.entries = Array.isArray(data?.entries) ? data.entries : [];
    out.draft = Array.isArray(data?.draft) ? data.draft : [];
    out.daily = data?.daily && typeof data.daily === 'object' ? data.daily : {};
    out.checklist = data?.checklist && typeof data.checklist === 'object' ? data.checklist : {};
    return out;
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function setState(mutator, silent=false) {
    mutator(state);
    save();
    render();
    if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function productById(id) { return state.products.find(p => p.id === id); }
  function calcProductAmount(product, grams) {
    const g = parseNum(grams);
    if (!product) return { kcal:0, protein:0, fat:0, carbs:0 };
    return {
      kcal: parseNum(product.kcal) * g / 100,
      protein: parseNum(product.protein) * g / 100,
      fat: parseNum(product.fat) * g / 100,
      carbs: parseNum(product.carbs) * g / 100
    };
  }
  function sumItems(items) {
    return items.reduce((acc, item) => {
      const p = productById(item.productId);
      const v = calcProductAmount(p, item.grams);
      acc.kcal += v.kcal; acc.protein += v.protein; acc.fat += v.fat; acc.carbs += v.carbs;
      if (p?.status === 'forbidden') acc.forbidden += 1;
      if (p?.status === 'caution') acc.caution += 1;
      return acc;
    }, { kcal:0, protein:0, fat:0, carbs:0, forbidden:0, caution:0 });
  }
  function entriesFor(date) { return state.entries.filter(e => e.date === date); }
  function daily(date) {
    if (!state.daily[date]) state.daily[date] = { weight:'', water:'', steps:'' };
    return state.daily[date];
  }
  function checklist(date) {
    if (!state.checklist[date]) state.checklist[date] = {
      noSugar: false,
      noBread: false,
      noNightSnack: false,
      lastMealOnTime: false,
      manualSlip: false
    };
    return state.checklist[date];
  }
  function totalsFor(date) { return sumItems(entriesFor(date)); }
  function totalsAfterDraft(date) {
    const a = totalsFor(date), b = sumItems(state.draft);
    return { kcal:a.kcal+b.kcal, protein:a.protein+b.protein, fat:a.fat+b.fat, carbs:a.carbs+b.carbs, forbidden:a.forbidden+b.forbidden, caution:a.caution+b.caution };
  }
  function statusFor(totals, chk = null) {
    const s = state.settings;
    if (chk?.manualSlip || totals.forbidden > 0 || totals.carbs > parseNum(s.carbFail)) {
      return { key:'bad', text:'Срыв', icon:'❌', className:'bad' };
    }
    if (totals.carbs > parseNum(s.carbGoal) || totals.caution >= 2 || totals.kcal > parseNum(s.calorieMax)) {
      return { key:'warn', text:'На грани', icon:'⚠️', className:'warn' };
    }
    return { key:'good', text:'Кетоз вероятен', icon:'✅', className:'good' };
  }
  function disciplineScore(date) {
    const t = totalsFor(date), d = daily(date), c = checklist(date), s = state.settings;
    const checks = [
      parseNum(d.weight) > 0,
      t.carbs > 0 ? t.carbs <= parseNum(s.carbGoal) : false,
      t.protein >= parseNum(s.proteinGoal),
      parseNum(d.water) >= parseNum(s.waterGoal),
      parseNum(d.steps) >= parseNum(s.stepsGoal),
      !!c.noSugar,
      !!c.noBread,
      !!c.noNightSnack,
      !!c.lastMealOnTime,
      !c.manualSlip && t.forbidden === 0
    ];
    const points = checks.filter(Boolean).length;
    return Math.round(points / checks.length * 100);
  }
  function adviceFor(date, totals = totalsFor(date), chk = checklist(date)) {
    const s = state.settings;
    const out = [];
    if (chk.manualSlip || totals.forbidden > 0) out.push('Есть запрещённый продукт или отмечен срыв. День для кето считаем сорванным — завтра возвращайся без компенсаций и голодовок.');
    if (totals.carbs > parseNum(s.carbFail)) out.push('Углеводы выше 50 г. Кетоз почти точно сбит. Убери сладкое, хлеб, крупы, фрукты и соусы.');
    else if (totals.carbs > parseNum(s.carbWarn)) out.push('Углеводы слишком высоко. Больше сегодня никаких молочных десертов, орехов, соусов и лишних овощей.');
    else if (totals.carbs > parseNum(s.carbGoal)) out.push('Ты выше целевого лимита углеводов. Кетоз под риском — дальше только мясо/рыба/яйца без углеводов.');
    else out.push('Углеводы в норме. Не добивай день случайными перекусами.');
    if (totals.protein < parseNum(s.proteinGoal) * .75 && totals.kcal > 300) out.push('Белка мало. Добавь мясо, рыбу или яйца, а не сыр/орехи/масло.');
    else if (totals.protein < parseNum(s.proteinGoal)) out.push('Белок ещё не добран. Лучший следующий шаг — чистый белок.');
    if (totals.kcal > parseNum(s.calorieMax)) out.push('Калории выше верхней границы. Убери масло, сыр и орехи — белок оставь.');
    if (parseNum(daily(date).water) < parseNum(s.waterGoal) && totals.kcal > 300) out.push('Воды мало. На кето это быстро даёт слабость и тягу к еде.');
    return out.slice(0, 3).join(' ');
  }
  function draftAdvice() {
    const current = totalsFor(state.selectedDate);
    const draft = sumItems(state.draft);
    const after = totalsAfterDraft(state.selectedDate);
    const s = state.settings;
    if (!state.draft.length) return 'Собери тарелку в черновике — увидишь, что будет с дневными лимитами до того, как съешь.';
    const out = [];
    if (draft.carbs > 15) out.push('В этом приёме много углеводов. Проверь овощи, молочку, соус или батончик.');
    if (after.carbs > parseNum(s.carbFail)) out.push('После этого приёма день будет сорван по углеводам. Уменьши углеводный продукт.');
    else if (after.carbs > parseNum(s.carbGoal)) out.push('После этого приёма углеводы выйдут за целевой лимит. Лучше урезать углеводную часть.');
    if (after.protein < parseNum(s.proteinGoal) && after.kcal > parseNum(s.calorieGoal) * .75) out.push('Белка всё ещё маловато — добавь рыбу/мясо/яйца, а не жир.');
    if (after.kcal > parseNum(s.calorieMax)) out.push('После этого приёма калории выше плана. Режь сыр, масло или орехи.');
    if (!out.length) out.push('Нормальная тарелка. Можно записывать как съеденное.');
    return out.join(' ');
  }

  function progressClass(value, goal, isLimit=false) {
    const ratio = parseNum(goal) ? parseNum(value)/parseNum(goal) : 0;
    if (isLimit && ratio > 2) return 'badbar';
    if (isLimit && ratio > 1) return 'warnbar';
    if (!isLimit && ratio < .65) return 'warnbar';
    return '';
  }
  function progressBar(value, goal, isLimit=false) {
    const pct = clamp(parseNum(goal) ? parseNum(value)/parseNum(goal)*100 : 0, 0, 130);
    return `<div class="progress"><div class="bar ${progressClass(value, goal, isLimit)}" style="width:${pct}%"></div></div>`;
  }
  function metric(label, value, goal, unit, isLimit=false) {
    return `<div class="metric">
      <div class="label"><span>${label}</span><span>${fmt(value, unit==='л'?1:0)} / ${fmt(goal, unit==='л'?1:0)} ${unit}</span></div>
      <div class="num mono">${fmt(value, unit==='л'?1:0)} ${unit}</div>

  }

  function renderChart(rows) {
    if (rows.length < 2) return '<div class="empty">Нужно минимум 2 записи веса для графика.</div>';
    const w = 680, h = 210, pad = 28;
    const vals = rows.map(r => r.weight);
    const min = Math.min(...vals) - .3, max = Math.max(...vals) + .3;
    const x = i => pad + i * ((w - pad*2) / Math.max(rows.length-1, 1));
    const y = v => h - pad - ((v - min) / Math.max(max-min, .1)) * (h - pad*2);
    const points = rows.map((r,i) => `${x(i)},${y(r.weight)}`).join(' ');
    const circles = rows.map((r,i) => `<circle cx="${x(i)}" cy="${y(r.weight)}" r="4" fill="#22c55e"><title>${r.date}: ${r.weight} кг</title></circle>`).join('');
    return `<div class="chartWrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="rgba(148,163,184,.22)" />
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(148,163,184,.22)" />
      <polyline points="${points}" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      ${circles}
      <text x="${pad}" y="20" fill="#94a3b8" font-size="13">${fmt(max,1)} кг</text>
      <text x="${pad}" y="${h-8}" fill="#94a3b8" font-size="13">${fmt(min,1)} кг</text>
    </svg></div>`;
  }

  function calcStreak() {
    const dates = Object.keys({...state.daily, ...state.checklist, ...Object.fromEntries(state.entries.map(e => [e.date, true]))}).sort();
    let streak = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      const date = dates[i];
      const st = statusFor(totalsFor(date), checklist(date));
      const hasData = entriesFor(date).length || parseNum(daily(date).weight) || parseNum(daily(date).steps) || parseNum(daily(date).water);
      if (!hasData) continue;
      if (st.key === 'bad') break;
      streak += 1;
    }
    return streak;
  }

          <div><label>Название</label><input id="pName" value="${esc(p.name)}" placeholder="Кета / яйца / сыр"></div>
          <div><label>Категория</label><input id="pCategory" value="${esc(p.category)}" placeholder="Рыба / мясо / молочка"></div>
          <div class="row"><div><label>Ккал на 100 г</label><input id="pKcal" inputmode="decimal" value="${esc(p.kcal)}"></div><div><label>Белки на 100 г</label><input id="pProtein" inputmode="decimal" value="${esc(p.protein)}"></div></div>
          <div class="row"><div><label>Жиры на 100 г</label><input id="pFat" inputmode="decimal" value="${esc(p.fat)}"></div><div><label>Углеводы на 100 г</label><input id="pCarbs" inputmode="decimal" value="${esc(p.carbs)}"></div></div>
          <div><label>Статус</label><select id="pStatus"><option value="keto" ${p.status==='keto'?'selected':''}>✅ кето</option><option value="caution" ${p.status==='caution'?'selected':''}>⚠️ осторожно</option><option value="forbidden" ${p.status==='forbidden'?'selected':''}>❌ запрещён</option></select></div>
          <div><label>Комментарий</label><textarea id="pComment" placeholder="например: можно часто / легко перебрать">${esc(p.comment)}</textarea></div>
          <button class="btn primary full" onclick="App.saveProduct()">Сохранить</button>
        </div>`);
      setTimeout(() => document.getElementById('pName')?.focus(), 50);
    },
    saveProduct() {
      const product = {
        id: editingProductId || uid(),
        name: document.getElementById('pName').value.trim(),
        category: document.getElementById('pCategory').value.trim(),
        kcal: parseNum(document.getElementById('pKcal').value),
        protein: parseNum(document.getElementById('pProtein').value),
        fat: parseNum(document.getElementById('pFat').value),
        carbs: parseNum(document.getElementById('pCarbs').value),
        status: document.getElementById('pStatus').value,
        comment: document.getElementById('pComment').value.trim()
      };
      if (!product.name) return toast('Название продукта обязательно');
      setState(s => {
        const i = s.products.findIndex(x => x.id === product.id);
        if (i >= 0) s.products[i] = product; else s.products.push(product);
      }, true);
      closeModal(); toast('Продукт сохранён');
    },
    deleteProduct(id) {
      if (!confirm('Удалить продукт? Старые записи с ним станут неполными.')) return;
      setState(s => { s.products = s.products.filter(p => p.id !== id); }, true);
      toast('Продукт удалён');
    },
    openAddFood(mode, itemId=null) {
      if (!state.products.length) { toast('Сначала добавь продукты в базу'); state.activeTab='products'; save(); render(); return; }
      editingEntryId = itemId;
      const list = mode === 'draft' ? state.draft : state.entries;
      const item = itemId ? list.find(x => x.id === itemId) : { productId:'', grams:'' };
      openModal(`<div class="modalHead"><h3>${mode==='draft'?'Черновик приёма':'Записать съеденное'}</h3><button class="btn small" onclick="App.closeModal()">×</button></div>
        <div class="form">
          <div><label>Продукт</label><select id="fProduct" onchange="App.previewFood()">${productOptions(item?.productId)}</select></div>
          <div><label>Граммы</label><input id="fGrams" inputmode="decimal" value="${esc(item?.grams || '')}" oninput="App.previewFood()" placeholder="250"></div>
          <div id="foodPreview" class="card soft"></div>
          <button class="btn primary full" onclick="App.saveFood('${mode}')">${itemId?'Сохранить':'Добавить'}</button>
        </div>`);
      setTimeout(() => { App.previewFood(); document.getElementById('fGrams')?.focus(); }, 50);
    },
    previewFood() {
      const p = productById(document.getElementById('fProduct')?.value);
      const grams = parseNum(document.getElementById('fGrams')?.value);
      const v = calcProductAmount(p, grams);
      const el = document.getElementById('foodPreview');
      if (!el) return;
      el.innerHTML = p ? `<div class="cardTitle"><h3>${esc(p.name)} · ${fmt(grams)} г</h3><span>${productStatus(p.status).html}</span></div>${totalsBox(v)}` : '<div class="empty">Выбери продукт и введи граммы.</div>';
    },
    saveFood(mode) {
      const productId = document.getElementById('fProduct').value;
      const grams = parseNum(document.getElementById('fGrams').value);
      if (!productId) return toast('Выбери продукт');
      if (grams <= 0) return toast('Введи граммы');
      const item = { id: editingEntryId || uid(), productId, grams, date: state.selectedDate };
      setState(s => {
        const list = mode === 'draft' ? s.draft : s.entries;
        const i = list.findIndex(x => x.id === item.id);
        if (mode === 'draft') delete item.date;
        if (i >= 0) list[i] = item; else list.push(item);
      }, true);
      closeModal(); toast(mode === 'draft' ? 'Добавлено в черновик' : 'Записано в день');
    },
    editFood(mode, id) { App.openAddFood(mode, id); },
    deleteFood(mode, id) {
      setState(s => { if (mode === 'draft') s.draft = s.draft.filter(x => x.id !== id); else s.entries = s.entries.filter(x => x.id !== id); }, true);
    },
    clearDraft() {
      if (!state.draft.length) return toast('Черновик уже пустой');
      if (!confirm('Очистить черновик?')) return;
      setState(s => { s.draft = []; }, true); toast('Черновик очищен');
    },
    commitDraft() {
      if (!state.draft.length) return toast('Черновик пустой');
      setState(s => {
        const date = s.selectedDate;
        s.entries.push(...s.draft.map(x => ({...x, id: uid(), date})));
        s.draft = [];
      }, true);
      toast('Черновик записан как съеденное');
    },
    closeModal,
    exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `keto-discipline-backup-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Экспорт готов');
    },
    importData() { document.getElementById('importFile')?.click(); },
    handleImportFile(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!confirm('Импорт заменить текущие данные?')) return;
          state = mergeDefaults(defaultState, data);
          save(); render(); toast('Данные импортированы');
        } catch (err) { toast('Не удалось прочитать JSON'); }
      };
      reader.readAsText(file);
    },
    resetAll() {
      if (!confirm('Точно очистить все продукты, еду и историю?')) return;
      if (!confirm('Последнее подтверждение: всё будет удалено с этого устройства.')) return;
      state = structuredClone(defaultState);
      save(); render(); toast('Данные очищены');
    }
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
  }
  render();
})();
</script>
</body>
</html>
